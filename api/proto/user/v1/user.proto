syntax = "proto3";

package community.user.v1;

option go_package = "github.com/likeslep/community/api/gen/user/v1;userv1";

// UserService 提供用户注册、登录、资料与内部用户查询能力。
service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc BanUser(BanUserRequest) returns (BanUserResponse);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  uint64 id = 1;
  string username = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  uint64 user_id = 2;
  string username = 3;
  string role = 4;
}

message GetProfileRequest {
  uint64 user_id = 1;
}

message GetProfileResponse {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string status = 5;
  string bio = 6;
  string avatar_file_id = 7;
}

message UpdateProfileRequest {
  uint64 user_id = 1;
  string email = 2;
  string bio = 3;
  string avatar_file_id = 4;
}

message UpdateProfileResponse {}

message GetUserRequest {
  uint64 user_id = 1;
}

message GetUserResponse {
  uint64 id = 1;
  string username = 2;
  string role = 3;
  string status = 4;
}

message ListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message UserBrief {
  uint64 id = 1;
  string username = 2;
  string role = 3;
  string status = 4;
}

message ListUsersResponse {
  repeated UserBrief users = 1;
}

message BanUserRequest {
  uint64 id = 1;
}

message BanUserResponse {}
